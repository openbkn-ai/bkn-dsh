name: release-plugin

# Publishes the plugin package `@openbkn/dsh-business-context` to npm.
#
# A `v*` tag IS the release: `v0.1.4` publishes version 0.1.4, and the tag must
# agree with packages/openbkn-business-context/package.json and with
# runtime/openbkn-dsh-runtime.manifest.json's `plugin` block — the runtime
# archive names the plugin tarball by version, so a tag that disagrees with
# either manifest would ship a runtime pointing at a package that does not
# exist. The check below fails the run instead.
#
# workflow_dispatch is the build-only mode: it runs the whole pipeline
# (install, patched-DSH build, tests, pack) without publishing, so a release
# can be rehearsed on a branch. Pass publish=true to make a dispatch publish
# the version currently in package.json.
#
# The build sequence mirrors compatible-runtime.yml, and for the same reason:
# the plugin build imports `@deepseek-ai/dsh-typert-generator/tsdown`, whose
# `lib/` only exists after the pinned DSH source is built. Nothing here can be
# shortened to a plain `pnpm build` without that clone.
#
# Auth is npm Trusted Publishing (OIDC) only — no npm token lives in this
# repository. npm exchanges the GitHub OIDC token for a short-lived publish
# credential scoped to this package, this repository and this workflow file.
# Every version is published with a provenance attestation, which binds the
# tarball to the commit and the run that built it.
#
# One-time bootstrap: npm can only attach a trusted publisher to a package that
# already exists (npm/cli#8544), and this workflow cannot publish until one is
# attached. So the first version of a new package goes up by hand — the same
# way @openbkn/bkn-sdk 0.1.0 did — and then:
#   npm trust github @openbkn/dsh-business-context \
#     --repo openbkn-ai/bkn-dsh --file release-plugin.yml --allow-publish
# The hand-published version carries no provenance; every release after it
# does. Do not put `provenance: true` in publishConfig: it would make that
# manual bootstrap fail, since provenance can only be generated in CI.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm (true) or build-only verify (false)'
        type: boolean
        default: false

# Tag runs must never cancel each other: each one mints a version that is
# referenced by number afterwards.
concurrency:
  group: release-plugin-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC for npm Trusted Publishing + provenance

jobs:
  publish:
    name: build, test and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every constant comes from the manifests, never from a literal repeated
      # here: the pinned DSH tag, the package name and the version all already
      # have one home each, and a second copy in this file is a copy that goes
      # stale silently.
      - name: Resolve release constants from the manifests
        id: constants
        shell: bash
        run: |
          set -euo pipefail
          node -e '
          const fs = require("fs")
          const manifest = JSON.parse(fs.readFileSync("runtime/openbkn-dsh-runtime.manifest.json", "utf8"))
          const pkg = JSON.parse(fs.readFileSync("packages/openbkn-business-context/package.json", "utf8"))
          const lines = [
            `DSH_TAG=${manifest.dsh.tag}`,
            `PKG_NAME=${pkg.name}`,
            `PKG_VERSION=${pkg.version}`,
            `MANIFEST_PLUGIN_VERSION=${manifest.plugin.version}`,
          ]
          fs.appendFileSync(process.env.GITHUB_ENV, lines.join("\n") + "\n")
          for (const line of lines) console.log(line)
          '

      # A dispatch publishes only when asked; a tag push always publishes.
      - name: Decide publish
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" || "${{ inputs.publish }}" == "true" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # Only a tag carries an independent claim about the version, so this is
      # where the three sources get reconciled. On a dispatch there is no tag
      # and package.json is the single source — but the manifest still has to
      # agree with it, because the runtime archive is built from that pair.
      - name: Check version agreement
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${MANIFEST_PLUGIN_VERSION}" != "${PKG_VERSION}" ]]; then
            echo "::error::runtime/openbkn-dsh-runtime.manifest.json says plugin ${MANIFEST_PLUGIN_VERSION}, package.json says ${PKG_VERSION}. The runtime archive names the plugin tarball by version — fix the manifest (plugin.version and plugin.artifact) before releasing."
            exit 1
          fi
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "${TAG_VERSION}" != "${PKG_VERSION}" ]]; then
              echo "::error::tag ${GITHUB_REF_NAME} resolves to ${TAG_VERSION}, but packages/openbkn-business-context/package.json is ${PKG_VERSION}. Bump the package (and the runtime manifest) first, then tag the commit that carries the bump."
              exit 1
            fi
          fi
          echo "Releasing ${PKG_NAME}@${PKG_VERSION}"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          # Lower bound of the plugin's own `engines`, so the build and tests
          # run on the oldest Node the package claims to support.
          node-version: 22.19.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Checkout pinned DSH source
        run: git clone --depth 1 --branch "${DSH_TAG}" https://github.com/deepseek-ai/deepseek-harness.git release/deepseek-harness

      - name: Point generator override at pinned DSH source
        run: node scripts/configure-pinned-dsh-generator.mjs --dsh release/deepseek-harness

      - name: Install bkn-dsh dependencies
        run: pnpm install --frozen-lockfile

      # Fail-closed check of the patch series against a clean pinned tree, same
      # as the runtime release does: a published plugin that only works against
      # a DSH the patches no longer apply to is a broken release.
      - name: Verify compatibility series on a clean pinned tree
        shell: bash
        run: |
          set -euo pipefail
          node compat/dsh-0.1.7-rc.2/apply.mjs --dsh release/deepseek-harness
          node compat/dsh-0.1.7-rc.2/verify.mjs --dsh release/deepseek-harness
          node compat/dsh-0.1.7-rc.2/apply.mjs --dsh release/deepseek-harness --revert

      # Builds the patched DSH and, with it, the typert generator the plugin
      # build imports.
      - name: Build compatible DSH runtime
        run: pnpm runtime:build -- --dsh release/deepseek-harness --output release/runtime

      - name: Test plugin and compatibility tooling
        # bash so every command's failure fails the step
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @openbkn/dsh-business-context test
          node --test compat/dsh-0.1.7-rc.2/tests/*.test.mjs tests/*.test.mjs runtime/tests/*.test.mjs
          pnpm run package:check

      - name: Build plugin
        run: pnpm --filter @openbkn/dsh-business-context build

      # Packs first and checks the tarball against the package's own export
      # map: every path `exports` (and `main`/`types`) points at must be inside
      # it. `files` is an allowlist and the build decides what exists, so an
      # export can point at a file that was never built or never packed — the
      # package then installs cleanly and fails at import time. The list is
      # derived rather than written out here, so a new export is covered the
      # moment it is added. npm cannot unpublish the mistake after 72 hours.
      - name: Pack and inspect the tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/release/plugin"
          pnpm --filter @openbkn/dsh-business-context pack --pack-destination "${GITHUB_WORKSPACE}/release/plugin"
          artifact="release/plugin/${PKG_NAME/@openbkn\//openbkn-}-${PKG_VERSION}.tgz"
          [ -f "$artifact" ] || { echo "::error::expected tarball $artifact was not produced"; exit 1; }
          tar -tzf "$artifact" | sort
          ARTIFACT="$artifact" node -e '
          const { execFileSync } = require("child_process")
          const listing = execFileSync("tar", ["-tzf", process.env.ARTIFACT], { encoding: "utf8" })
          const packed = new Set(listing.trim().split("\n").map((f) => f.replace(/^package\//, "")))
          const pkg = JSON.parse(execFileSync("tar", ["-xzOf", process.env.ARTIFACT, "package/package.json"], { encoding: "utf8" }))
          const targets = []
          const walk = (entry, where) => {
            if (typeof entry === "string") targets.push([where, entry])
            else if (entry && typeof entry === "object") for (const [k, v] of Object.entries(entry)) walk(v, `${where} ${k}`)
          }
          walk(pkg.exports, "exports")
          if (pkg.main) targets.push(["main", pkg.main])
          if (pkg.types) targets.push(["types", pkg.types])
          const missing = targets.filter(([, f]) => !packed.has(f.replace(/^\.\//, "")))
          for (const [where, f] of missing) console.log(`::error::${where} -> ${f} is not in the tarball (never built, or not in the \`files\` allowlist)`)
          if (missing.length) process.exit(1)
          console.log(`all ${targets.length} export/main/types targets are packed`)
          '

      # A prerelease (0.1.5-alpha.0) publishes under its own label, so it never
      # becomes what `npm install @openbkn/dsh-business-context` resolves to; a
      # stable version takes `latest`.
      - name: Resolve dist-tag
        id: disttag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${PKG_VERSION}" == *-* ]]; then
            label="${PKG_VERSION#*-}"; label="${label%%.*}"
            echo "dist=${label}" >> "$GITHUB_OUTPUT"
          else
            echo "dist=latest" >> "$GITHUB_OUTPUT"
          fi

      # Publishing runs on a toolchain of its own, separate from the Node the
      # tests above ran on. Trusted publishing needs npm >= 11.5.1, and the npm
      # that registers publish permissions is 12 — which requires Node
      # ^22.22.2 || ^24.15.0, so it cannot run on the 22.19.0 used for the
      # tests. This pair is the one @openbkn/bkn-sdk publishes with through
      # trusted publishing today. npm is pinned, not `latest`: `latest` moved
      # to 12 and raised its Node floor between two releases, which would have
      # broken this step with no change in this repository.
      - uses: actions/setup-node@v4
        if: ${{ steps.gate.outputs.publish == 'true' }}
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org

      - name: Pin npm for publishing
        if: ${{ steps.gate.outputs.publish == 'true' }}
        run: |
          npm install -g npm@12.0.2
          echo "publishing with node $(node -v), npm $(npm -v)"

      # npm never lets a version be published twice, so a tag whose version is
      # already on the registry — a re-run after a later step failed, or the
      # hand-published bootstrap version being tagged afterwards — would
      # otherwise fail at publish after everything else passed. Skip instead,
      # loudly. A lookup that errors for any other reason reads as "not
      # published", so the publish below still runs and fails on its own if
      # the version does exist.
      - name: Check whether this version is already on npm
        id: published
        if: ${{ steps.gate.outputs.publish == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          # Compared on output, not only on the exit code: an npm that answered
          # "no such version" with exit 0 and empty output would otherwise make
          # every tag skip its publish silently.
          found="$(npm view "${PKG_NAME}@${PKG_VERSION}" version --registry https://registry.npmjs.org 2>/dev/null || true)"
          if [[ "$found" == "${PKG_VERSION}" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Already published::${PKG_NAME}@${PKG_VERSION} is already on npm, so the publish step is skipped. Build and tests above still ran against this commit."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC token with the
      # registry. Trusted publishing would attach provenance on its own;
      # `--provenance` is explicit anyway so the publish fails instead of
      # shipping an unattested version if the attestation cannot be produced.
      - name: Publish to npm
        if: ${{ steps.gate.outputs.publish == 'true' && steps.published.outputs.exists != 'true' }}
        working-directory: packages/openbkn-business-context
        run: npm publish --access public --provenance --tag ${{ steps.disttag.outputs.dist }}

      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo "### ${PKG_NAME}@${PKG_VERSION}"
            echo
            echo "- dist-tag: \`${{ steps.disttag.outputs.dist }}\`"
            echo "- publish requested: ${{ steps.gate.outputs.publish }}"
            echo "- already on npm before this run: ${{ steps.published.outputs.exists || 'n/a' }}"
            echo "- auth: trusted publishing (OIDC), with provenance"
            echo "- pinned DSH: \`${DSH_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-tarball
          path: release/plugin/*.tgz
          if-no-files-found: warn
