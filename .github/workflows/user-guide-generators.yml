name: User guide generators

on:
  pull_request:
    paths:
      - 'docs/user-guide/**'
      - '.github/workflows/user-guide-generators.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GUIDE_TEST_FONT: ${{ github.workspace }}/NotoSansSC.ttf
      PYTHONUTF8: '0'
      PYTHONCOERCECLOCALE: '0'
      PYTHONIOENCODING: utf-8
      LC_ALL: C
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r docs/user-guide/tools/requirements-test.txt
      - name: Download and verify the Chinese test font
        shell: python
        run: |
          import hashlib, os, urllib.request
          from pathlib import Path
          url = 'https://raw.githubusercontent.com/google/fonts/2894aab31764f10f29c421bdfd2340d3b382d384/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf'
          data = urllib.request.urlopen(url, timeout=90).read()
          assert hashlib.sha256(data).hexdigest() == 'a3041811a78c361b1de50f953c805e0244951c21c5bd412f7232ef0d899af0da'
          Path(os.environ['GUIDE_TEST_FONT']).write_bytes(data)
      - name: Test encoding, content coverage and full guide generation
        run: python docs/user-guide/tools/test_generators.py
      - name: Generate a PDF for visual inspection
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP']) / 'generated-guide.pdf'
          subprocess.run([sys.executable, 'docs/user-guide/tools/export_pdf.py', '--font', os.environ['GUIDE_TEST_FONT'], '--output', str(output)], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: user-guide-${{ matrix.os }}
          path: ${{ runner.temp }}/generated-guide.pdf
          retention-days: 7
