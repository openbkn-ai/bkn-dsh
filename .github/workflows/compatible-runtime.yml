name: compatible-runtime

on:
  workflow_dispatch:
  push:
    tags: ["openbkn-dsh-runtime-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin-arm64
          - runner: windows-2022
            platform: win32-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release constants from the manifests
        shell: bash
        run: |
          set -euo pipefail
          node -e '
          const fs = require("fs")
          const manifest = JSON.parse(fs.readFileSync("runtime/openbkn-dsh-runtime.manifest.json", "utf8"))
          const pkg = JSON.parse(fs.readFileSync("packages/openbkn-business-context/package.json", "utf8"))
          const artifact = `${pkg.name.replace("@openbkn/", "openbkn-")}-${pkg.version}.tgz`
          const bundle = `${manifest.bundle.name}-${manifest.bundle.version}`
          fs.appendFileSync(process.env.GITHUB_ENV, `PLUGIN_ARTIFACT=${artifact}\nBUNDLE_NAME=${bundle}\nDSH_TAG=${manifest.dsh.tag}\n`)
          console.log(`PLUGIN_ARTIFACT=${artifact}`)
          console.log(`BUNDLE_NAME=${bundle}`)
          console.log(`DSH_TAG=${manifest.dsh.tag}`)
          '
      - name: Preserve repository LF patch bytes
        shell: bash
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          git checkout -- .
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Checkout pinned DSH source
        run: git clone --depth 1 --branch "${DSH_TAG}" https://github.com/deepseek-ai/deepseek-harness.git release/deepseek-harness
      - name: Point generator override at pinned DSH source
        run: node scripts/configure-pinned-dsh-generator.mjs --dsh release/deepseek-harness
      - name: Install bkn-dsh dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify compatibility series on a clean pinned tree
        # bash so a failed verify cannot hide behind a successful revert
        shell: bash
        run: |
          set -euo pipefail
          node compat/dsh-0.1.7-rc.2/apply.mjs --dsh release/deepseek-harness
          node compat/dsh-0.1.7-rc.2/verify.mjs --dsh release/deepseek-harness
          node compat/dsh-0.1.7-rc.2/apply.mjs --dsh release/deepseek-harness --revert
      - name: Build compatible DSH runtime
        run: pnpm runtime:build -- --dsh release/deepseek-harness --output release/runtime
      - name: Test plugin and compatibility tooling
        # bash so every command's failure fails the step; pwsh would exit on
        # the LAST native command's code and swallow a mid-block failure
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @openbkn/dsh-business-context test
          node --test compat/dsh-0.1.7-rc.2/tests/*.test.mjs tests/*.test.mjs runtime/tests/*.test.mjs
          pnpm run package:check
      - name: Build and pack bkn-dsh
        # bash so a failed build cannot hide behind a successful pack
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @openbkn/dsh-business-context build
          pnpm --filter @openbkn/dsh-business-context pack --pack-destination release/plugin
      - name: Prepare DSH-native Web profile
        # ${{ env.* }} expands before the shell runs, so it works under pwsh and bash alike ($VAR would silently empty under pwsh)
        run: pnpm runtime:profile -- --runtime release/runtime --plugin "release/plugin/${{ env.PLUGIN_ARTIFACT }}" --output release/profile
      - name: Package runtime archive
        run: pnpm runtime:package -- --runtime release/runtime --profile release/profile --plugin "release/plugin/${{ env.PLUGIN_ARTIFACT }}" --output release/artifacts --platform ${{ matrix.platform }}
      - name: Check runtime portability
        run: node scripts/check-runtime-portability.mjs --output release/artifacts --platform ${{ matrix.platform }}
      - name: Smoke-test the assembled runtime entrypoint
        shell: bash
        run: |
          set -euo pipefail
          bundle="release/artifacts/${{ env.BUNDLE_NAME }}-${{ matrix.platform }}"
          smoke_home="$(mktemp -d)"
          if [[ "${{ matrix.platform }}" == win32-x64 ]]; then
            # cmd.exe /c is non-interactive; --version jumps straight to the
            # run label. The Node guard's ACCEPT path executes on every
            # invocation (its REJECT path is covered by the dedicated step
            # below); bootstrap is skipped by design for --version.
            # cmd.exe needs backslashes and an unmangled /c switch.
            bundle_cmd="${bundle//\//\\}"
            version="$(OPENBKN_DSH_HOME="$smoke_home" MSYS_NO_PATHCONV=1 cmd.exe /c "$bundle_cmd\\bin\\dsh.cmd" --version | tr -d '\r')"
          else
            version="$(OPENBKN_DSH_HOME="$smoke_home" "$bundle/bin/dsh" --version)"
          fi
          echo "entrypoint reported: $version"
          # DSH_TAG = "dsh-vX"; the entrypoint reports the bare upstream version "X"
          grep -q "${DSH_TAG#dsh-v}" <<< "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: openbkn-dsh-runtime-${{ matrix.platform }}
          path: release/artifacts/*
          if-no-files-found: error
      - name: Put an unsupported Node first on PATH (win32 negative setup)
        if: matrix.platform == 'win32-x64'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify the launcher rejects an unsupported Node (win32)
        if: matrix.platform == 'win32-x64'
        shell: bash
        run: |
          set -euo pipefail
          bundle="release/artifacts/${{ env.BUNDLE_NAME }}-${{ matrix.platform }}"
          bundle_cmd="${bundle//\//\\}"
          echo "guard will run under Node $(node --version)"
          set +e
          MSYS_NO_PATHCONV=1 cmd.exe /c "$bundle_cmd\\bin\\dsh.cmd" --version > /tmp/guard.out 2>&1
          guard_exit=$?
          set -e
          tr -d '\r' < /tmp/guard.out
          echo "guard exit=$guard_exit"
          [[ $guard_exit -ne 0 ]] || { echo "guard unexpectedly accepted Node 20"; exit 1; }
          grep -q "requires Node" /tmp/guard.out || { echo "guard rejection message missing"; exit 1; }

  publish:
    if: startsWith(github.ref, 'refs/tags/openbkn-dsh-runtime-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
