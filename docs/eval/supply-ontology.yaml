# Minimal answer-accuracy evaluation set for the supply_ontology_hand knowledge
# network. One question per case; checkers are judged per criterion (all must
# hold for a pass). Baseline-verified cases carry facts that were independently
# checked against the platform MySQL during M5 / the 2026-09-20 runtime run.
#
# Run with: node docs/eval/run-eval.mjs            (interactive judgement)
#           node docs/eval/run-eval.mjs --list     (print the set)
#           node docs/eval/run-eval.mjs --answers docs/eval/answers.example.json

network: supply_ontology_hand
cases:
  - id: orders-count-status
    group: positive
    baselineVerified: true
    question: 382-000005 有多少张销售订单？什么状态？
    expectFacts:
      - 销售订单共 40 张
      - 状态只有「已确认」一种
      - 明细单号落在 SO0000001–SO0000020 与 SO0000501–SO0000520 两个区间
    expectTools: [query_object_instance, 平台指标类查询]
    forbidden:
      - 编造的数量或状态（与上述基准不符）
      - 声称存在其他状态的订单
  - id: finished-goods-inventory
    group: positive
    baselineVerified: true
    question: 382-000005 在各成品仓的可用库存？
    expectFacts:
      - 3 个成品仓合计 534
      - 苏州 325 / 乌鲁木齐 127 / 哈尔滨 82
      - 明确说明口径（仅成品仓，其他仓另计）
    expectTools: [query_object_instance, 库存/指标类查询]
    forbidden:
      - 把非成品仓库存计入合计
      - 与基准不符的仓间拆分
  - id: standard-lead-time
    group: positive
    baselineVerified: true
    question: 382-000005 的标准交期？
    expectFacts:
      - 生产固定提前期 = 1 天（自制件口径）
      - 与 erp_material 口径一致
    expectTools: [query_object_instance, 主数据查询]
    forbidden:
      - 无口径说明的单一天数
  - id: bom-structure
    group: positive
    baselineVerified: false
    question: 382-000005 的 BOM 构成是什么？
    expectFacts:
      - 列出 BOM 组件与层级结构
      - 组件数量与名称来自平台数据并注明来源
    expectTools: [query_object_instance, BOM/关联查询]
    forbidden:
      - 未注明来源的组件清单
  - id: purchase-flow
    group: positive
    baselineVerified: false
    question: 382-000005 当前有哪些未结的采购申请和采购订单？
    expectFacts:
      - 分别列出采购申请与采购订单（或明确说明无未结项）
      - 状态与单号来自平台数据
    expectTools: [query_object_instance, 单据流查询]
    forbidden:
      - 混淆采购申请与采购订单两类单据
  - id: sales-order-detail
    group: positive
    baselineVerified: false
    question: 列出 382-000005 的销售订单明细。
    expectFacts:
      - 单号、数量、状态逐条对应平台数据
      - 合计与前述总量一致（40 张）
    expectTools: [query_object_instance, 明细查询]
    forbidden:
      - 明细条数与合计矛盾

  - id: missing-object
    group: negative
    question: 物料 999-999999 的库存和订单情况？
    expectFacts:
      - 明确回答无该物料/无数据
      - 不给出任何非零业务数值（「查询命中 0 行」一类的无数据证明不算）
    expectTools: [query_object_instance]
    forbidden:
      - 编造的库存或订单数字
      - 崩溃或空回复
  - id: invalid-token
    group: negative
    question: （先使平台 Token 失效，再问 382-000005 的销售订单数量）
    expectFacts:
      - 明确的认证失败提示（引导重新登录/刷新 Token）
      - 不返回部分或缓存业务数据
    expectTools: []
    forbidden:
      - 静默失败或伪装成功
      - 输出任何业务数值
  - id: platform-unreachable
    group: negative
    question: （先使平台不可达，再问 382-000005 的销售订单数量）
    expectFacts:
      - 明确的连接失败提示（客户端整轮报错横幅或模型报告均可）
      - 会话仍可用，平台恢复后可继续其他操作
    expectTools: []
    forbidden:
      - 无响应或永久挂死（单轮失败横幅不算——2026-09-23 实测即此形态）
      - 编造数据
  - id: unauthorized-network
    group: negative
    question: （以无 supply_ontology_hand 权限的账号绑定后提问）
    expectFacts:
      - 明确的权限不足提示
      - 不泄露该网络内的任何业务数据
    expectTools: []
    forbidden:
      - 越权返回数据
